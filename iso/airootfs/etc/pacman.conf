#
# Live-system pacman.conf for Luksarchy ISO
# The local repo is embedded at /repo inside the squashfs.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5

[core-local]
SigLevel = Optional TrustAll
Server = file:///repo

[extra-local]
SigLevel = Optional TrustAll
Server = file:///repo

# Official mirrors kept as fallback (disabled for pure offline use)
#[core]
#Include = /etc/pacman.d/mirrorlist
#[extra]
#Include = /etc/pacman.d/mirrorlist
