#
# Build-time pacman.conf for Luksarchy ISO (generated by build_iso)
#
[options]
HoldPkg            = pacman glibc
Architecture       = auto
CheckSpace
SigLevel           = Required DatabaseOptional
LocalFileSigLevel  = Optional
ParallelDownloads  = 5

# Local repository (highest priority)
[core-local]
SigLevel = Optional TrustAll
Server   = file:///home/lukesh/luksarchy/iso/repo

[extra-local]
SigLevel = Optional TrustAll
Server   = file:///home/lukesh/luksarchy/iso/repo

# Official mirrors - fallback when a package is missing from the local repo
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
