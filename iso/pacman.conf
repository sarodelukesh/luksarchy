#
# Build-time pacman.conf for Luksarchy ISO (generated by build_iso)
# Server paths point at the host-side local repo so mkarchiso can
# install packages offline.  The live system uses a different
# config under airootfs/etc/pacman.conf with Server = file:///repo.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
#DownloadUser = alpm

# Local offline repositories (highest priority)
[core-local]
SigLevel = Optional TrustAll
Server = file:///home/lukesh/lukstonarchy/iso/repo

[extra-local]
SigLevel = Optional TrustAll
Server = file:///home/lukesh/lukstonarchy/iso/repo

# Fallback to official mirrors (used only when a package is missing
# from the local repo – normally never hit during an offline build)
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
